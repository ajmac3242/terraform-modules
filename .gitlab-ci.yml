stages:
  - validate
  - plan
  - apply

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_DEFAULT_REGION: "us-east-1"
  TERRAGRUNT_NON_INTERACTIVE: "true"

default:
  image:
    name: ghcr.io/gruntwork-io/terragrunt:latest
    entrypoint: [""]
  cache:
    key: terraform
    paths:
      - .terraform/
      - .terragrunt-cache/
      - .terraform-plugin-cache/
  before_script:
    - terraform --version
    - terragrunt --version

.aws_oidc:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/web_identity_token"
    - printf '%s' "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
    - export AWS_ROLE_ARN="$AWS_ROLE_ARN"
    - export AWS_REGION="$AWS_DEFAULT_REGION"
    - export AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION"

validate:
  stage: validate
  extends: .aws_oidc
  script:
    - cd infrastructure
    - terragrunt run-all validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - infrastructure/**/*

plan:
  stage: plan
  extends: .aws_oidc
  script:
    - cd infrastructure
    - terragrunt run-all plan -no-color
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - infrastructure/**/.terragrunt-cache
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - infrastructure/**/*

apply:
  stage: apply
  extends: .aws_oidc
  script:
    - cd infrastructure
    - terragrunt run-all apply -auto-approve -no-color
  environment:
    name: production
  resource_group: production
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - infrastructure/**/*
