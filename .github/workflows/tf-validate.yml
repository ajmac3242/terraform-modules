name: Terraform Validate & Format

on:
  pull_request:
    branches: [main]
    paths:
      - 'aws/**'
      - '.github/workflows/tf-validate.yml'
  push:
    branches: [main]
    paths:
      - 'aws/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  discover-modules:
    name: Discover Terraform Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Find all Terraform modules
        id: find-modules
        run: |
          # Find all directories containing a versions.tf (marks a complete module)
          modules=$(find aws -name 'versions.tf' -exec dirname {} \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Found modules: $modules"

  terraform-fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.7'

      - name: Check Terraform formatting
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Comment on PR if fmt fails
        if: steps.fmt.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Terraform Format Check Failed\n\nRun `terraform fmt -recursive` locally to fix formatting issues, then push again.'
            })

      - name: Fail if fmt check failed
        if: steps.fmt.outcome == 'failure'
        run: exit 1

  terraform-validate:
    name: Validate - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: discover-modules
    if: needs.discover-modules.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.7'

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.module }}
        run: terraform validate

      - name: Check required files exist
        working-directory: ${{ matrix.module }}
        run: |
          for file in main.tf variables.tf outputs.tf versions.tf README.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file '$file' is missing in ${{ matrix.module }}"
              exit 1
            fi
          done
          echo "All required module files present."
