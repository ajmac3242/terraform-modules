name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'aws/**'
      - '.github/workflows/ci.yml'
      - '.terraform-docs.yml'
      - '.tflint.hcl'
  push:
    branches:
      - main
    paths:
      - 'aws/**'
      - '.github/workflows/ci.yml'
      - '.terraform-docs.yml'
      - '.tflint.hcl'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  discover:
    name: Discover Terraform modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build module matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          matrix_json=$(
            find aws -type f -name main.tf \
              -exec dirname {} \; \
              | sort -u \
              | jq -R -s -c 'split("\n")[:-1] | map({working-directory: .}) | {include: .}'
          )

          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

  fmt:
    name: Terraform Fmt
    runs-on: ubuntu-latest
    needs: discover

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format Terraform
        run: terraform fmt -recursive

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          commit_message: "style(terraform): auto-format Terraform"

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: [discover, fmt]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

  lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    needs: [discover, validate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Cache TFLint plugins
        uses: actions/cache@v5
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint -f compact

  docs:
    name: Terraform Docs
    runs-on: ubuntu-latest
    needs: [discover, lint]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Render terraform-docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: ${{ matrix.working-directory }}
          output-file: README.md
          output-method: inject
          git-push: "true"
