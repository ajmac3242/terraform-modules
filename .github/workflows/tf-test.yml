name: Terraform Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'aws/**'
      - '.github/workflows/tf-test.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  discover-modules:
    name: Discover Modules with Tests
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Find modules with test directories
        id: find-modules
        run: |
          # Find modules that have a tests/ directory (native terraform test)
          modules=$(find aws -name 'versions.tf' -exec dirname {} \; | while read dir; do
            if [ -d "$dir/tests" ]; then
              echo "$dir"
            fi
          done | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Found modules with tests: $modules"

  terraform-test:
    name: Test - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: discover-modules
    if: needs.discover-modules.outputs.modules != '[]' && needs.discover-modules.outputs.modules != 'null'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.7'

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: Terraform Test
        working-directory: ${{ matrix.module }}
        run: terraform test
        env:
          TF_CLI_ARGS_test: '-verbose'

  no-tests-notice:
    name: No Tests Found
    runs-on: ubuntu-latest
    needs: discover-modules
    if: needs.discover-modules.outputs.modules == '[]' || needs.discover-modules.outputs.modules == 'null'
    steps:
      - name: Notice
        run: |
          echo "No modules with tests/ directories found yet."
          echo "Add a tests/*.tftest.hcl file to a module to enable testing."
