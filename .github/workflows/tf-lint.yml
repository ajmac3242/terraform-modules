name: TFLint

on:
  pull_request:
    branches: [main]
    paths:
      - 'aws/**'
      - '.github/workflows/tf-lint.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  discover-modules:
    name: Discover Terraform Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Find all Terraform modules
        id: find-modules
        run: |
          modules=$(find aws -name 'versions.tf' -exec dirname {} \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  tflint:
    name: TFLint - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: discover-modules
    if: needs.discover-modules.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.7'

      - name: Init TFLint
        working-directory: ${{ matrix.module }}
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        working-directory: ${{ matrix.module }}
        run: |
          tflint \
            --enable-rule=terraform_required_version \
            --enable-rule=terraform_required_providers \
            --enable-rule=terraform_naming_convention \
            --enable-rule=terraform_documented_variables \
            --enable-rule=terraform_documented_outputs \
            --enable-rule=terraform_typed_variables \
            --format=compact
