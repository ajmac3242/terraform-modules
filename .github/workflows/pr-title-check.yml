name: PR Title Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            // Conventional commits pattern for this repo
            // Types: feat, fix, docs, ci, refactor, test, chore, security
            // Optional scopes: forge, sentinel, backlog, terraform-docs
            // Examples:
            //   feat(forge): aws/base_component/kms - KMS module
            //   fix(forge): aws/base_component/iam - correct assume role policy
            //   ci: add tf-validate workflow
            //   docs(sentinel): update security backlog
            const pattern = /^(feat|fix|docs|ci|refactor|test|chore|security)(\([a-z0-9_/-]+\))?!?: .{1,100}$/;

            if (!pattern.test(title)) {
              const message = [
                '## PR Title Does Not Follow Conventional Commits',
                '',
                `**Current title:** \`${title}\``,
                '',
                '**Required format:** `<type>(<optional-scope>): <description>`',
                '',
                '**Allowed types:** `feat`, `fix`, `docs`, `ci`, `refactor`, `test`, `chore`, `security`',
                '',
                '**Examples:**',
                '- `feat(forge): aws/base_component/kms — KMS CMK module`',
                '- `fix(forge): aws/base_component/iam — correct assume role policy`',
                '- `ci: add tf-validate workflow`',
                '- `docs(sentinel): update security backlog`',
                '- `security: enforce CMK on all S3 modules`',
              ].join('\n');

              core.setFailed(message);
            } else {
              console.log(`PR title is valid: ${title}`);
            }
